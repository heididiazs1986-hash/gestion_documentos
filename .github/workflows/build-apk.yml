name: Build GS Documentos APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node dependencies
        run: npm install

      - name: Validate GS Documentos runtime and templates
        run: |
          node --check v77-fix.js
          node --check v78-storage-fix.js
          node scripts/validate_templates.js

      - name: Prepare web assets for APK
        run: python3 scripts/prepare_apk.py web

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Require stable release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.GS_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.GS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GS_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GS_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Faltan secretos de firma release. No se generará una APK debug como distribución."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/GS_Documentos_release.jks"
          echo "GS_HAS_SIGNING=true" >> "$GITHUB_ENV"
          echo "GS_ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/GS_Documentos_release.jks" >> "$GITHUB_ENV"
          echo "GS_ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "GS_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GS_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "Firma release disponible."

      - name: Apply GS Documentos Android settings
        run: python3 scripts/prepare_apk.py android

      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name APK
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk GS_Documentos_v77_RELEASE.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GS-Documentos-v77-APK
          path: GS_Documentos_v77*.apk
          if-no-files-found: error
          retention-days: 30
